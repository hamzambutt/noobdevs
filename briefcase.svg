    <!-- Bow Tie -->
    <path d="M 100 82 L 82 72 L 85 92 Z M 100 82 L 83 74 L 85 90 Z" fill="#ffc2c2" stroke-width="1.2" />
    <path d="M 100 82 L 118 74 L 115 90 Z M 100 82 L 117 76 L 114 88 Z" fill="#ffc2c2" stroke-width="1.2" />
    <circle cx="100" cy="82" r="3" fill="#ffc2c2" stroke-width="1.2" />

    <!-- Ground / Horizon Lines -->
    <path d="M 50 355 L 140 355 M 52 356 L 138 356 M 150 355 L 165 355 M 152 356 L 163 356 M 172 355 L 175 355" stroke-width="1.5" />

