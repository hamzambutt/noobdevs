    <path d="M 62 185 L 86 185 L 86 250 L 62 250 Z M 63 187 L 85 187 M 63 248 L 85 248" stroke-width="1.5" />
    <!-- Briefcase vertical lines/texture -->
    <path d="M 66 185 L 66 250 M 70 185 L 70 250 M 74 185 L 74 250 M 78 185 L 78 250 M 82 185 L 82 250" stroke-width="1" />

    <!-- Head Fill and Sketchy Outline -->
    <circle cx="100" cy="50" r="28" fill="#fcf7b1" stroke="none" />
    <path d="M 128 50 A 28 28 0 1 1 127.9 49 A 27.5 28.5 0 1 1 127.8" stroke-width="1.5" />

    <!-- Eyes -->
    <ellipse cx="90" cy="45" rx="3.5" ry="4.5" fill="#666" stroke="none" />
    <ellipse cx="106" cy="45" rx="3.5" ry="4.5" fill="#666" stroke="none" />
    
    <!-- Eyebrows -->
    <path d="M 85 36 Q 90 33 95 37 M 86 35 Q 90 32 94 36" stroke-width="1" />
    <path d="M 101 37 Q 106 33 111 36 M 102 36 Q 106 32 110 35" stroke-width="1" />

