    <!-- Waving Hand -->
    <path d="M 160 55 C 152 40, 168 30, 175 42 C 180 50, 165 62, 158 56 M 159 54 C 153 41, 167 32, 173 41" stroke-width="1.2" />

    <!-- Legs -->
    <path d="M 100 230 Q 90 280 85 340 M 102 230 Q 93 280 87 340" stroke-width="1.5" />
    <path d="M 100 230 Q 110 280 115 340 M 98 230 Q 107 280 113 340" stroke-width="1.5" />

